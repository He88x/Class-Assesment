<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AB | Frontend Developer</title>
  <!--Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!--NAV-->
  <header class="header">
    <nav class="navbar container">
      <a href="#" class="logo">AB</a>

      <ul class="nav-links" id="nav-links">
        <li><a href="#" class="active">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#work">work</a></li>
        <li><a href="#service">Service</a></li>
        <li><a href="#contact">contact</a></li>
      </ul>

      <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="nav-links">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </nav>
  </header>

  <!--Hero-->
  <main>
    <section class="hero">
      <div class="hero-container container">
        <div class="hero-content">
          <p class="hero-eyebrow">
            HI, I'M A FRONTEND DEVELOPER
          </p>
          <h1>
            I build clean,
            <span>modern</span> websites
          </h1>
          <p class="hero-description">
            I turn ideas into responsive and user-friendly
            web experiences. Let's build something great
            together.
          </p>
          <a href="#work" class="hero-button">
            View My Work
            <span>→</span>
          </a>
        </div>
        <div class="hero-image">
          <img
            src="images/profile.png"
            alt="Profile portrait"
          >
        </div>
      </div>
    </section>
  </main>

  <script>
    const navToggle = document.getElementById('nav-toggle');
    const navLinks = document.getElementById('nav-links');

    navToggle.addEventListener('click', () => {
      const isOpen = navLinks.classList.toggle('is-open');
      navToggle.classList.toggle('is-open', isOpen);
      navToggle.setAttribute('aria-expanded', isOpen);
    });

    // Close the mobile menu after a link is tapped
    navLinks.querySelectorAll('a').forEach((link) => {
      link.addEventListener('click', () => {
        navLinks.classList.remove('is-open');
        navToggle.classList.remove('is-open');
        navToggle.setAttribute('aria-expanded', 'false');
      });
    });
  </script>
</body>
</html>
